<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Zielone tło -->
  <circle cx="50" cy="50" r="50" fill="#166534"/>

  <!-- === LILIA HARCERSKA (fleur-de-lis) === -->

  <!-- Środkowy płatek — główny, spiczasty ku górze -->
  <path d="M50 10
    C48 16, 44 24, 43 32
    C42 39, 45 44, 50 46
    C55 44, 58 39, 57 32
    C56 24, 52 16, 50 10Z"
    fill="white"/>

  <!-- Krzyż grecki na środkowym płatku (wycięty z tła) -->
  <rect x="47.8" y="16" width="4.4" height="15" fill="#166534" rx="0.8"/>
  <rect x="43.5" y="20.5" width="13" height="4.4" fill="#166534" rx="0.8"/>

  <!-- Lewy płatek — wygięty w lewo -->
  <path d="M48 43
    C44 39, 37 35, 30 34
    C23 33, 18 37, 18 43
    C18 49, 24 53, 32 52
    C38 51, 44 47, 48 44Z"
    fill="white"/>

  <!-- Prawy płatek — wygięty w prawo (symetria) -->
  <path d="M52 43
    C56 39, 63 35, 70 34
    C77 33, 82 37, 82 43
    C82 49, 76 53, 68 52
    C62 51, 56 47, 52 44Z"
    fill="white"/>

  <!-- Obroża (collar) — poziomy pasek łączący płatki z podstawą -->
  <path d="M34 51
    Q50 56 66 51
    L65 58
    Q50 63 35 58 Z"
    fill="white"/>

  <!-- Trzpień / podstawa -->
  <path d="M44.5 57
    L43 70
    Q50 75 57 70
    L55.5 57
    Q50 62 44.5 57Z"
    fill="white"/>

  <!-- Boczne skrzydełka podstawy (petites feuilles) -->
  <path d="M43 62
    C39 59, 33 61, 33 66
    C33 70, 38 71, 43 69Z"
    fill="white"/>
  <path d="M57 62
    C61 59, 67 61, 67 66
    C67 70, 62 71, 57 69Z"
    fill="white"/>
</svg>
