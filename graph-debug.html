<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graph Debug — Campas Pathfinding</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui;background:#1a1a2e;color:white;height:100vh;display:flex;flex-direction:column}
  #toolbar{background:#16213e;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:13px}
  button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:12px}
  .btn-primary{background:#e94560;color:white} .btn-success{background:#0e9d57;color:white}
  #info{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}
  #info span{display:inline-flex;align-items:center;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot-dock{background:#e9a345} .dot-junc{background:#8b5cf6}
  .line-edge{width:20px;height:2px;background:#0e9d57;display:inline-block}
</style>
</head>
<body>
<div id="toolbar">
  <button class="btn-primary" onclick="reload()">🔄 Odśwież</button>
  <button class="btn-success" onclick="exportGraph()">📋 Eksportuj JSON grafu</button>
  <div id="info">
    <span><span class="dot dot-dock"></span> Dokowanie</span>
    <span><span class="dot dot-junc"></span> Węzeł</span>
    <span><span class="line-edge"></span> Krawędź</span>
    <span id="stats"></span>
  </div>
</div>
<canvas id="canvas"></canvas>

<script type="module">
  // Dynamiczne importowanie danych mapy
  import {
    DOCK_POSITIONS, REAL_PATHS, NODE_AREAS,
  } from '../frontend/src/data/mapNodes.js'

  const img = new Image()
  img.src = '../frontend/src/assets/map/tlo.png'

  const JUNCTIONS = [
    {id:'j_main_start',x:518,y:261},{id:'j_etap1_main',x:377,y:302},{id:'j_pedag_main',x:223,y:419},
    {id:'j_psp_main',x:412,y:631},{id:'j_zal_psp_main',x:358,y:599},{id:'j_kuratorium_main',x:383,y:915},
    {id:'j_stage5_main',x:574,y:1119},{id:'j_main_end',x:414,y:1268},{id:'j_zal_psp_instr',x:138,y:519},
    {id:'j_zal_psp_mapy',x:155,y:575},{id:'j_zal_psp_srodki',x:245,y:607},{id:'j_kuratorium_cross',x:313,y:861},
    {id:'j_stage5_smieci',x:619,y:1097},{id:'j_stage5_latryna',x:643,y:1070},{id:'j_stage5_mauzer',x:629,y:1027},
    {id:'j_stage5_szp_pol',x:595,y:973},
  ]

  const TOLERANCE = 8
  function dist(a,b) { return Math.hypot(a.x-b.x,a.y-b.y) }

  function buildGraph() {
    const allNodes = new Map()
    for (const [id, pos] of Object.entries(DOCK_POSITIONS)) {
      allNodes.set(id, { id, x: pos.x, y: pos.y, type: 'dock' })
    }
    for (const j of JUNCTIONS) {
      allNodes.set(j.id, { id: j.id, x: j.x, y: j.y, type: 'junction' })
    }

    const adj = new Map()
    for (const [nid] of allNodes) adj.set(nid, [])

    // Faza 1: endpointy ścieżek
    for (const path of REAL_PATHS) {
      const pts = path.points
      if (pts.length < 2) continue
      let sN=null, eN=null, sD=Infinity, eD=Infinity
      for (const [nid, node] of allNodes) {
        const ds = dist(pts[0], node), de = dist(pts[pts.length-1], node)
        if (ds < sD) { sD=ds; sN=nid }
        if (de < eD) { eD=de; eN=nid }
      }
      if (sN && sD < TOLERANCE*2 && eN && eD < TOLERANCE*2 && sN !== eN) {
        adj.get(sN).push({ to: eN, via: [...pts] })
        adj.get(eN).push({ to: sN, via: [...pts].reverse() })
      }
      // Faza 2: węzły w środku ścieżki
      for (const [nid, node] of allNodes) {
        if (nid === sN || nid === eN) continue
        let cIdx=-1, cDist=Infinity
        for (let i=0;i<pts.length;i++) { const d=dist(pts[i],node); if(d<cDist){cDist=d;cIdx=i} }
        if (cDist < TOLERANCE*2 && cIdx>1 && cIdx<pts.length-2) {
          adj.get(sN).push({ to: nid, via: pts.slice(0,cIdx+1) })
          adj.get(nid).push({ to: sN, via: pts.slice(0,cIdx+1).reverse() })
          adj.get(nid).push({ to: eN, via: pts.slice(cIdx) })
          adj.get(eN).push({ to: nid, via: pts.slice(cIdx).reverse() })
        }
      }
    }
    return { allNodes, adj }
  }

  const canvas = document.getElementById('canvas')
  const ctx = canvas.getContext('2d')

  function draw() {
    const { allNodes, adj } = buildGraph()
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    ctx.drawImage(img, 0, 0)

    // Edges
    for (const [nid, edges] of adj) {
      const from = allNodes.get(nid)
      for (const { to, via } of edges) {
        const too = allNodes.get(to)
        if (!too) continue
        ctx.beginPath()
        ctx.strokeStyle = '#0e9d57'
        ctx.lineWidth = 2
        ctx.setLineDash([6,4])
        if (via.length > 1) {
          ctx.moveTo(via[0].x, via[0].y)
          for (let i=1; i<via.length; i++) ctx.lineTo(via[i].x, via[i].y)
        } else {
          ctx.moveTo(from.x, from.y); ctx.lineTo(too.x, too.y)
        }
        ctx.stroke()
        ctx.setLineDash([])
      }
    }

    // Junctions
    for (const [nid, node] of allNodes) {
      if (node.type === 'junction') {
        ctx.beginPath(); ctx.arc(node.x, node.y, 6, 0, Math.PI*2)
        ctx.fillStyle = '#8b5cf6'; ctx.fill()
        ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke()
        ctx.fillStyle = 'white'; ctx.font = '10px system-ui'; ctx.textAlign = 'center'
        ctx.fillText(nid, node.x, node.y - 10)
      } else {
        ctx.beginPath(); ctx.arc(node.x, node.y, 8, 0, Math.PI*2)
        ctx.fillStyle = '#e9a345'; ctx.fill()
        ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke()
        ctx.fillStyle = 'white'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'
        ctx.fillText(nid, node.x, node.y - 14)
      }
    }

    // Stats
    let edgeCount = 0
    for (const [, edges] of adj) edgeCount += edges.length
    document.getElementById('stats').textContent = `${allNodes.size} węzłów · ${edgeCount/2} krawędzi`
  }

  img.onload = () => { canvas.width = img.width; canvas.height = img.height; draw() }

  window.reload = () => { location.reload() }
  window.exportGraph = () => {
    const { allNodes, adj } = buildGraph()
    const data = { nodes: {}, edges: [] }
    for (const [nid, node] of allNodes) data.nodes[nid] = { x: node.x, y: node.y, type: node.type }
    for (const [nid, edges] of adj) {
      for (const { to, via } of edges) {
        data.edges.push({ from: nid, to, via })
      }
    }
    navigator.clipboard.writeText(JSON.stringify(data, null, 2))
    alert('Graf skopiowany do schowka!')
  }

  if (img.complete && img.naturalWidth > 0) draw()
</script>
</body>
</html>
