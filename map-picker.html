<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map Coordinator — Campas Dashboard 2.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: white; overflow: hidden; height:100vh; display:flex }
  #sidebar { width: 380px; background: #16213e; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0 }
  #sidebar h2 { font-size: 15px; margin-bottom: 2px }
  #canvas-wrap { flex:1; overflow: auto; background: #0f3460; position: relative }
  canvas { display: block }
  button, select { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600 }
  .btn-primary { background: #e94560; color: white } .btn-primary:hover { background: #ff6b6b }
  .btn-secondary { background: #0f3460; color: white; border: 1px solid #e94560 } .btn-secondary:hover { background: #1a1a5e }
  .btn-success { background: #0e9d57; color: white } .btn-success:hover { background: #12b863 }
  .btn-danger { background: #6c1a1a; color: white; border:1px solid #e94560 }
  .btn-dock { background: #e9a345; color: white } .btn-dock:hover { background: #fbbf24 }
  .btn-junction { background: #8b5cf6; color: white } .btn-junction:hover { background: #a78bfa }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #e94560; color: white }
  select { background: #0f3460; color:white; border:1px solid #e94560; flex:1; font-size: 12px }
  textarea { width:100%; height: 180px; background:#0f3460; color:#00ff88; border:1px solid #e94560; border-radius:6px; padding:8px; font-family: monospace; font-size:11px; resize:vertical }
  .mode-indicator { padding:4px 8px; border-radius:4px; font-size:12px; font-weight:bold; text-align:center }
  .mode-polygon { background: #e94560 } .mode-path { background: #0e9d57 } .mode-dock { background: #e9a345 } .mode-junction { background: #8b5cf6 } .mode-none { background: #333 }
  .item-list { max-height: 160px; overflow-y: auto }
  .item-row { display:flex; justify-content:space-between; align-items:center; padding:3px 6px; margin:2px 0; background:#0f3460; border-radius:4px; font-size:11px }
  .item-row button { padding:1px 6px; font-size:11px }
  hr { border-color: #333; margin: 4px 0 }
  input { background:#0f3460; color:white; border:1px solid #e94560; border-radius:6px; padding:6px 8px; font-size:12px }
</style>
</head>
<body>
<div id="sidebar">
  <h2>🗺️ Map Coordinator</h2>
  <p style="font-size:11px; color:#888">LPM = dodaj punkt | PPM = cofnij | Drag&amp;Drop = nowy obraz</p>

  <div class="row">
    <button class="btn-dock" id="btnDock">📍 Punkt dokowania</button>
    <button class="btn-junction" id="btnJunction">🔗 Węzeł ścieżki</button>
    <button class="btn-primary" id="btnPolygon">🎯 Obszar (poligon)</button>
    <button class="btn-success" id="btnPath">🛤️ Ścieżka</button>
  </div>

  <div class="mode-indicator mode-none" id="modeBadge">TRYB: —</div>

  <div class="row">
    <input id="itemName" placeholder="Nazwa (np. 3.1 PSP, skrzyżowanie A)" style="flex:1" />
    <button class="btn-primary" id="finishBtn">✅ Zatwierdź</button>
  </div>
  <div class="row">
    <button class="btn-secondary" id="undoBtn">↩ Cofnij</button>
    <button class="btn-danger" id="clearBtn">🗑 Wyczyść bieżący</button>
  </div>

  <hr />

  <h3>📍 Dokowanie <span class="badge" id="dockCount">0</span></h3>
  <div class="item-list" id="dockList"></div>
  <h3>🔗 Węzły <span class="badge" id="juncCount">0</span></h3>
  <div class="item-list" id="juncList"></div>
  <h3>🎯 Obszary <span class="badge" id="polyCount">0</span></h3>
  <div class="item-list" id="polyList"></div>
  <h3>🛤️ Ścieżki <span class="badge" id="pathCount">0</span></h3>
  <div class="item-list" id="pathList"></div>

  <hr />
  <textarea id="output" readonly placeholder="Eksportuj JSON..."></textarea>
  <div class="row">
    <button class="btn-success" id="exportBtn">📋 Eksportuj JSON</button>
    <button class="btn-secondary" id="copyBtn">📎 Kopiuj</button>
    <button class="btn-danger" id="resetBtn">🗑 Reset</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas')
const ctx = canvas.getContext('2d')
const img = new Image()
img.src = 'frontend/src/assets/map/tlo.png'
img.onload = () => { canvas.width = img.width; canvas.height = img.height; draw() }

let mode = ''  // dock | junction | polygon | path
let currentPoints = []
let docks = []          // { name, x, y }
let junctions = []      // { name, x, y }
let polygons = []       // { name, points: [{x,y}...] }
let paths = []           // { name, points: [{x,y}...] }

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  ctx.drawImage(img, 0, 0)

  // Dokowanie — niebieskie romby
  docks.forEach(d => {
    ctx.beginPath(); ctx.moveTo(d.x-8, d.y); ctx.lineTo(d.x, d.y-10); ctx.lineTo(d.x+8, d.y); ctx.lineTo(d.x, d.y+10); ctx.closePath()
    ctx.fillStyle = '#e9a345'; ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke()
    ctx.fillStyle = 'white'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'
    ctx.fillText(d.name, d.x, d.y - 16)
  })

  // Węzły — fioletowe koła
  junctions.forEach(j => {
    ctx.beginPath(); ctx.arc(j.x, j.y, 7, 0, Math.PI*2)
    ctx.fillStyle = '#8b5cf6'; ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke()
    ctx.fillStyle = 'white'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'
    ctx.fillText(j.name, j.x, j.y - 14)
  })

  // Obszary
  polygons.forEach(p => {
    if (p.points.length < 3) return
    ctx.beginPath(); ctx.moveTo(p.points[0].x, p.points[0].y)
    for (let i=1; i<p.points.length; i++) ctx.lineTo(p.points[i].x, p.points[i].y)
    ctx.closePath()
    ctx.fillStyle = 'rgba(233,69,96,0.25)'; ctx.fill()
    ctx.strokeStyle = '#e94560'; ctx.lineWidth = 2; ctx.stroke()
    p.points.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2); ctx.fillStyle = '#e94560'; ctx.fill() })
    const cx = p.points.reduce((s,p)=>s+p.x,0)/p.points.length
    const cy = p.points.reduce((s,p)=>s+p.y,0)/p.points.length
    ctx.fillStyle = 'white'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(p.name, cx, cy-10)
  })

  // Ścieżki
  paths.forEach(p => {
    if (p.points.length < 2) return
    ctx.beginPath(); ctx.moveTo(p.points[0].x, p.points[0].y)
    for (let i=1; i<p.points.length; i++) ctx.lineTo(p.points[i].x, p.points[i].y)
    ctx.strokeStyle = '#0e9d57'; ctx.lineWidth = 3; ctx.setLineDash([8,6]); ctx.stroke(); ctx.setLineDash([])
    p.points.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2); ctx.fillStyle = '#0e9d57'; ctx.fill() })
    const mid = Math.floor(p.points.length/2)
    ctx.fillStyle = 'white'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(p.name, p.points[mid].x, p.points[mid].y-12)
  })

  // Bieżące punkty
  currentPoints.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2)
    ctx.fillStyle = i === currentPoints.length-1 ? 'white' : 'rgba(255,255,255,0.7)'; ctx.fill()
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke()
  })
  if (currentPoints.length > 1 && (mode === 'polygon' || mode === 'path')) {
    ctx.beginPath(); ctx.moveTo(currentPoints[0].x, currentPoints[0].y)
    for (let i=1; i<currentPoints.length; i++) ctx.lineTo(currentPoints[i].x, currentPoints[i].y)
    if (mode === 'polygon') ctx.closePath()
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([])
  }
}

canvas.addEventListener('click', (e) => {
  if (!mode) return
  const rect = canvas.getBoundingClientRect()
  const scaleX = canvas.width / rect.width
  const scaleY = canvas.height / rect.height
  const x = Math.round((e.clientX - rect.left) * scaleX)
  const y = Math.round((e.clientY - rect.top) * scaleY)

  if (mode === 'dock' || mode === 'junction') {
    currentPoints = [{ x, y }]
    draw()
  } else {
    currentPoints.push({ x, y })
    draw()
  }
})
canvas.addEventListener('contextmenu', e => { e.preventDefault(); currentPoints.pop(); draw() })

function setMode(m) {
  mode = m; currentPoints = []
  const labels = { dock: 'TRYB: PUNKT DOKOWANIA', junction: 'TRYB: WĘZEŁ ŚCIEŻKI', polygon: 'TRYB: RYSUJ OBSZAR', path: 'TRYB: RYSUJ ŚCIEŻKĘ', '': 'TRYB: —' }
  const cls = { dock: 'mode-dock', junction: 'mode-junction', polygon: 'mode-polygon', path: 'mode-path', '': 'mode-none' }
  document.getElementById('modeBadge').textContent = labels[m] || labels['']
  document.getElementById('modeBadge').className = 'mode-indicator ' + (cls[m] || cls[''])
  draw()
}

document.getElementById('btnDock').onclick = () => setMode('dock')
document.getElementById('btnJunction').onclick = () => setMode('junction')
document.getElementById('btnPolygon').onclick = () => setMode('polygon')
document.getElementById('btnPath').onclick = () => setMode('path')

document.getElementById('finishBtn').onclick = () => {
  if (!mode) return alert('Wybierz tryb')
  const name = document.getElementById('itemName').value.trim() || `bez_nazwy_${Date.now()}`
  if (mode === 'dock' && currentPoints.length === 1) {
    docks.push({ name, x: currentPoints[0].x, y: currentPoints[0].y })
  } else if (mode === 'junction' && currentPoints.length === 1) {
    junctions.push({ name, x: currentPoints[0].x, y: currentPoints[0].y })
  } else if (mode === 'polygon' && currentPoints.length >= 3) {
    polygons.push({ name, points: [...currentPoints] })
  } else if (mode === 'path' && currentPoints.length >= 2) {
    paths.push({ name, points: [...currentPoints] })
  } else {
    return alert(mode==='polygon'?'Obszar: min 3 pkt':mode==='path'?'Ścieżka: min 2 pkt':'Kliknij na mapę')
  }
  currentPoints = []; document.getElementById('itemName').value = ''; refreshLists(); draw()
}

document.getElementById('undoBtn').onclick = () => { currentPoints.pop(); draw() }
document.getElementById('clearBtn').onclick = () => { currentPoints = []; draw() }

document.getElementById('exportBtn').onclick = () => {
  const data = {
    docks: docks.map(d=>({name:d.name, x:d.x, y:d.y})),
    junctions: junctions.map(j=>({name:j.name, x:j.x, y:j.y})),
    polygons: polygons.reduce((acc,p)=>({...acc,[p.name]:p.points.map(pt=>({x:pt.x,y:pt.y}))}), {}),
    paths: paths.map(p=>({name:p.name, points:p.points.map(pt=>({x:pt.x,y:pt.y}))}))
  }
  document.getElementById('output').value = JSON.stringify(data, null, 2)
}
document.getElementById('copyBtn').onclick = () => { navigator.clipboard.writeText(document.getElementById('output').value); alert('Skopiowane!') }
document.getElementById('resetBtn').onclick = () => { if(confirm('Usunąć wszystko?')){ docks=[];junctions=[];polygons=[];paths=[];currentPoints=[];refreshLists();draw() } }

function refreshLists() {
  document.getElementById('dockCount').textContent = docks.length
  document.getElementById('juncCount').textContent = junctions.length
  document.getElementById('polyCount').textContent = polygons.length
  document.getElementById('pathCount').textContent = paths.length
  document.getElementById('dockList').innerHTML = docks.map((d,i)=>`<div class="item-row"><span>${d.name}</span>(${d.x},${d.y})<button class="btn-danger" onclick="delDock(${i})">✕</button></div>`).join('')
  document.getElementById('juncList').innerHTML = junctions.map((j,i)=>`<div class="item-row"><span>${j.name}</span>(${j.x},${j.y})<button class="btn-danger" onclick="delJunc(${i})">✕</button></div>`).join('')
  document.getElementById('polyList').innerHTML = polygons.map((p,i)=>`<div class="item-row"><span>${p.name}</span>${p.points.length} pkt<button class="btn-danger" onclick="delPoly(${i})">✕</button></div>`).join('')
  document.getElementById('pathList').innerHTML = paths.map((p,i)=>`<div class="item-row"><span>${p.name}</span>${p.points.length} pkt<button class="btn-danger" onclick="delPath(${i})">✕</button></div>`).join('')
}
window.delDock = (i) => { docks.splice(i,1); refreshLists(); draw() }
window.delJunc = (i) => { junctions.splice(i,1); refreshLists(); draw() }
window.delPoly = (i) => { polygons.splice(i,1); refreshLists(); draw() }
window.delPath = (i) => { paths.splice(i,1); refreshLists(); draw() }

// Drag & drop
document.addEventListener('dragover', e => e.preventDefault())
document.addEventListener('drop', e => {
  e.preventDefault()
  const file = e.dataTransfer.files[0]
  if (!file || !file.type.startsWith('image/')) return
  const reader = new FileReader()
  reader.onload = () => { img.src = reader.result }
  reader.readAsDataURL(file)
})
</script>
</body>
</html>
